[package]
name = "gvm-rs"
authors.workspace = true
description.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true

[workspace]
members = ["gvm-rs-derive", "bdd-tests"]

[workspace.package]
authors = ["Björn Ricks <bjoern.ricks@gmail.com>"]
description = "A Rust library for connecting to the Greenbone Vulnerability Management API."
edition = "2024"
license = "GPL-3.0-or-later"
readme = "README.md"
version = "0.1.0"

[[bin]]
name = "gvm-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:dotenvy", "ssh"]
async-tokio = ["dep:tokio", "quick-xml/async-tokio"]
ssh = ["dep:ssh2"]
ssh-async = ["async-tokio", "dep:russh"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.51", optional = true, features = ["derive", "env"] }
dotenvy = { version = "0.15.7", optional = true }
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.18.0"
thiserror = "2.0.18"
tokio = { version = "1.47.1", optional = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["serde"] }
gvm-rs-derive = { path = "./gvm-rs-derive" }
russh = { version = "0.62", optional = true }
ssh2 = { version = "0.9", optional = true }
